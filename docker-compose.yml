services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: remind
      POSTGRES_USER: remind
      POSTGRES_PASSWORD: remind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remind -d remind"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:

